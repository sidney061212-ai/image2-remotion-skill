# Image2 Remotion Skill Workflow Preset Selection Logic Update

## Action

Follow the preset-selection-logic-update workflow:
1. Update selection and validation logic in src/skill/normalizeRequest.ts and src/skill/selectPreset.ts
2. Update or add related validation logic in src/skill/validateRequest.ts
3. Update preset type definitions if necessary in src/presets/types.ts
4. Update preset registry in src/presets/index.ts if preset availability changes
5. Update or add related tests in tests/normalizeRequest.test.ts, tests/selectPreset.test.ts, tests/presetRegistry.test.ts, tests/validateRequest.test.ts
6. Update documentation if behavior changes (README.md, SKILL.md, docs/acceptance-checklist.md, docs/preset-contract.md, docs/ai-usage.md)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
